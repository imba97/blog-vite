[build]
publish = "dist"
command = "pnpm run build"

[build.environment]
NODE_VERSION = "22"
# 搜索产物默认从 bigseek 的 GitHub Release 下载（wasm 包 + linux 原生 build-index + 契约向量），
# 构建端不需要任何 Rust 工具链；下面这项只在强制 SEARCH_WASM_WASM_SOURCE=source 时才起作用。
SEARCH_WASM_BOOTSTRAP = "1"
# 默认自动取 bigseek 最新的正式 tag（形如 vX.Y.Z），发版后不需要改这里；
# 只有想固定版本、或想用预发布 tag（v0.2.0-rc.1）时才显式指定：
# SEARCH_WASM_REF = "v0.1.1"
# 想强制从源码编译（非 linux x64 平台会自动这么做）：SEARCH_WASM_WASM_SOURCE = "source"

# 构建产物强缓存 1 年（hash 文件名天然支持缓存更新）
[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
X-Content-Type-Options = "nosniff"

# HTML 走强校验（每次部署即时生效），并启用 Brotli / Vary 协商
[[headers]]
for = "*.html"

[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"
Vary = "Accept-Encoding"

# 字体单独声明 CORS，允许跨域加载
[[headers]]
for = "/assets/fonts/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
Access-Control-Allow-Origin = "*"

# 历史上传图片内容不可变（按日期归档、原地不覆盖），长缓存
[[headers]]
for = "/uploads/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# 搜索索引与 RSS 随每次构建变化但 URL 不带 hash，短缓存 + 回源校验
[[headers]]
for = "/search-full.json"

[headers.values]
Cache-Control = "public, max-age=3600, must-revalidate"

# 搜索 wasm 产物（wasm / glue / search.idx / manifest）同样不带 hash：
# 索引每次构建都会变，必须回源校验；wasm 与 glue 虽稳定，但一起短缓存更好回滚
[[headers]]
for = "/search/*"

[headers.values]
Cache-Control = "public, max-age=3600, must-revalidate"
X-Content-Type-Options = "nosniff"

[[headers]]
for = "/search-meta.json"

[headers.values]
Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
for = "/feed.xml"

[headers.values]
Cache-Control = "public, max-age=3600, must-revalidate"

# 安全相关 CSP（允许自托管脚本与第三方统计）
[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
from = "/atom.xml"
to = "/feed.xml"
status = 301

[[redirects]]
from = "/posts/:id/index.html"
to = "/post/:id"
status = 301

[[redirects]]
from = "/posts/:id"
to = "/post/:id"
status = 301

[[redirects]]
from = "/favicon.png"
to = "/assets/images/favicon.png"
status = 301

[[redirects]]
from = "/avatar.png"
to = "/assets/images/favicon.png"
status = 301

# SPA fallback：未匹配到的路径交给 index.html，由 vue-router 处理
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
