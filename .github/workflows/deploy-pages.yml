name: Deploy to Cloudflare Pages

# 触发：推送到默认分支，或手动触发
on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          # 输出静态图片路径，避免依赖 Netlify Image CDN
          IMAGE_PIPELINE: static
          SEARCH_WASM_BOOTSTRAP: '1'

      - name: Install initx CLI
        run: npm install -g initx@latest

      # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 由 ix env run 从 vault 注入，
      # 不要在此处再用 ${{ secrets.* }} 声明，否则空值会覆盖注入结果
      # --branch 必须等于项目的 production branch（创建时用了 main），
      # 否则 wrangler 会把部署归到 Preview，pages.dev 正式域名始终为空
      - name: Deploy to Cloudflare Pages
        run: ix --yes env run blog --config initx-env.config.ts -- pnpm dlx wrangler pages deploy dist --project-name=imba97-blog --branch=main
        env:
          INITX_ENV_TOKEN: ${{ secrets.INITX_ENV_TOKEN }}
