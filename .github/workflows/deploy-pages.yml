name: Deploy to Cloudflare Pages

# 触发：推送到默认分支，或手动触发
on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # initx CLI 用于从 vault 注入环境变量（仅本仓库 CI 部署用途）
      # env 插件不是内置的，首次使用必须显式安装；安装时会询问确认，
      # 用管道喂 Y 跳过交互（CI 无 TTY）
      - name: Install initx CLI and env plugin
        run: |
          npm install -g initx@latest
          echo Y | ix plugin add env

      - name: Build
        run: pnpm run build
        env:
          # 输出静态图片路径，避免依赖 Netlify Image CDN
          IMAGE_PIPELINE: static
          SEARCH_WASM_BOOTSTRAP: '1'

      # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 由 ix env run 从 vault 注入，
      # 不要在此处再用 ${{ secrets.* }} 声明，否则空值会覆盖注入结果
      - name: Deploy to Cloudflare Pages
        run: ix env run blog -- pnpm dlx wrangler pages deploy dist --project-name=imba97-blog --branch=production
        env:
          INITX_ENV_TOKEN: ${{ secrets.INITX_ENV_TOKEN }}
